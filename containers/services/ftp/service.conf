# FTP: vsftpd (only if FTP is scored on this box - FTP_SCORED in ccdc.conf)
DESC="vsftpd - config, users and files stay on the host"
FAMILIES="deb rpm"
REQUIRE='^vsftpd$'
PKG_PATTERNS='^(vsftpd|libnss-sss|libpam-sss|sssd-client)$'
HOST_UNITS="vsftpd"
NO_NEW_PRIVS=yes
STOP_TIMEOUT=10
WAIT=30
MOUNTS=(
  /etc/vsftpd.conf:ro /etc/vsftpd:ro /etc/vsftpd.userlist:ro /etc/ftpusers:ro /etc/vsftpd.chroot_list:ro
  /etc/passwd:ro /etc/shadow:ro /etc/group:ro /etc/pam.d:ro /etc/nsswitch.conf:ro /etc/security:ro
  /var/lib/sss/pipes
  /home /srv/ftp /var/ftp
  /etc/ssl:ro /etc/pki/tls:ro
  /var/log
)
TESTS=("banner 21 ^220")
