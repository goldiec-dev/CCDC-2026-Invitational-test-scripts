# Mail: Postfix (SMTP) + Dovecot (POP3/IMAP) in one container
DESC="Postfix + Dovecot - config, queue, mailboxes and the user database stay on the host"
FAMILIES="deb rpm"
REQUIRE='^postfix$'
PKG_PATTERNS='^(postfix|postfix-.*|dovecot|dovecot-.*|libsasl2-modules.*|cyrus-sasl.*|sasl2-bin|rsyslog|libnss-sss|libpam-sss|sssd-client|libpam-ldapd|libnss-ldapd|nss-pam-ldapd|libpam-krb5|pam_krb5|opendkim|opendkim-tools|postgrey|spamassassin|spamc|amavisd-new|clamav-milter)$'
EXTRA_PKGS_deb="rsyslog"          # writes mail.log inside the container
EXTRA_PKGS_rpm="rsyslog"
HOST_UNITS="postfix dovecot"
NO_NEW_PRIVS=no                 # Postfix's postdrop / Dovecot need their setgid/setuid helpers
STOP_TIMEOUT=30
WAIT=60
MOUNTS=(
  /etc/postfix /etc/dovecot:ro /etc/aliases /etc/aliases.db /etc/mailname:ro
  /var/spool/postfix            # the queue
  /var/mail /var/spool/mail /var/vmail /home /var/lib/dovecot    # mailboxes (rule 8: keep existing mail)
  /etc/ssl:ro /etc/pki/tls:ro /etc/letsencrypt:ro
  /etc/passwd:ro /etc/shadow:ro /etc/group:ro /etc/gshadow:ro     # the same users (restart the container after password changes)
  /etc/pam.d:ro /etc/nsswitch.conf:ro /etc/security:ro
  /var/lib/sss/pipes            # AD/LDAP users through the host's SSSD (it keeps running on the host)
  /etc/opendkim:ro /etc/opendkim.conf:ro
  /var/log                      # mail.log stays where Splunk and the checklists expect it
)
TESTS=("banner 25 ^220" "banner 110 ^\+OK" "banner 143 ^\* OK" "tcp 993" "tcp 995" "tcp 587" "tcp 465")
# Our rsyslog inside replaced the host rsyslog's socket in Postfix's chroot - give it back on rollback
hook_after_rollback() { systemctl restart rsyslog 2> /dev/null; }
