# E-com web server: Apache httpd + PHP (php-fpm) on Rocky / RHEL family
DESC="Apache httpd + PHP (the shop) - code, config, certificates and logs stay on the host"
FAMILIES="rpm"
REQUIRE='^httpd$'
PKG_PATTERNS='^(httpd|httpd-tools|mod_ssl|mod_security.*|mod_http2|mod_fcgid|php|php-.*)$'
MODULE_NAMES="php httpd"
HOST_UNITS="httpd php-fpm"
NO_NEW_PRIVS=yes
STOP_TIMEOUT=20
WAIT=60
MOUNTS=(
  /var/www                      # the shop's code and uploads
  /etc/httpd:ro /etc/php.ini:ro /etc/php.d:ro /etc/php-fpm.conf:ro /etc/php-fpm.d:ro
  /etc/pki/tls:ro /etc/pki/ca-trust:ro /etc/letsencrypt:ro
  /var/log/httpd /var/log/php-fpm
  /var/lib/php                  # PHP sessions
  /var/lib/mysql                # MariaDB's socket (the database itself runs on the host, or in ccdc-ecom-db)
  /run/mysqld /run/mariadb
  /etc/passwd:ro /etc/group:ro
)
TESTS=("web")
