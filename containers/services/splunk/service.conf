# Splunk Enterprise: the host's own /opt/splunk (binaries, config, indexes) run inside a container
DESC="Splunk - the whole /opt/splunk stays on the host; the container only supplies the OS around it"
FAMILIES="deb rpm"
REQUIRE=''
REQUIRE_PATH=/opt/splunk/bin/splunk
PKG_PATTERNS=''
HOST_UNITS="Splunkd splunk"
NO_NEW_PRIVS=yes
STOP_TIMEOUT=180               # Splunk takes a while to stop cleanly
WAIT=240
MOUNTS=(
  /opt/splunk
  /etc/passwd:ro /etc/group:ro
  /var/log:ro                   # host log files Splunk monitors
)
TESTS=("http 8000" "https 8089")
