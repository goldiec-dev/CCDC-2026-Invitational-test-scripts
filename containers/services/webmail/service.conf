# Webmail: Apache + PHP serving Roundcube (Debian / Ubuntu)
DESC="Apache + PHP for Roundcube - the Roundcube code, config, database and Apache config stay on the host"
FAMILIES="deb"
REQUIRE='^apache2$'
PKG_PATTERNS='^(apache2|apache2-bin|apache2-data|apache2-utils|libapache2-mod-php.*|php[0-9.]*|php[0-9.]*-.*|php-.*|roundcube|roundcube-core|roundcube-mysql|roundcube-sqlite3|roundcube-pgsql|roundcube-plugins|libapache2-mod-security2|ssl-cert)$'
HOST_UNITS="apache2"
NO_NEW_PRIVS=yes
STOP_TIMEOUT=20
WAIT=60
MOUNTS=(
  /etc/apache2:ro /etc/php:ro
  /var/www
  /usr/share/roundcube:ro /etc/roundcube:ro /var/lib/roundcube /var/log/roundcube
  /usr/share/javascript:ro      # Roundcube's libjs-* links point here
  /etc/ssl:ro /etc/letsencrypt:ro
  /var/log/apache2 /var/lib/php
  /run/mysqld                   # MySQL socket, if Roundcube uses MySQL
  /etc/passwd:ro /etc/group:ro
)
TESTS=("web")
