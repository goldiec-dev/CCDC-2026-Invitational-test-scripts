# The shop's database: MariaDB or MySQL from the host's own repositories (same major version)
DESC="MariaDB/MySQL - the data directory and config stay on the host"
FAMILIES="rpm deb"
REQUIRE='^(mariadb-server|mysql-server)(-[0-9.]+)?$'
PKG_PATTERNS='^(mariadb|mysql)$|^(mariadb|mysql)-(server|client|common|backup|errmsg|server-utils)(-core)?(-[0-9.]+)?$|^galera(-[0-9]+)?$'
MODULE_NAMES="mariadb mysql"
HOST_UNITS="mariadb mysqld mysql"
NO_NEW_PRIVS=yes
STOP_TIMEOUT=60
WAIT=90
MOUNTS=(
  /var/lib/mysql                # the data - never run two servers on it (the host service is masked)
  /etc/my.cnf:ro /etc/my.cnf.d:ro /etc/mysql:ro
  /var/log/mariadb /var/log/mysql
  /run/mysqld /run/mariadb
  /etc/passwd:ro /etc/group:ro
)
TESTS=("tcp 3306" "socket")
# Refuse unless the image's server has the same major.minor version as the host's
hook_preflight() {
  local b hv iv
  for b in /usr/libexec/mariadbd /usr/libexec/mysqld /usr/sbin/mariadbd /usr/sbin/mysqld; do [ -x "$b" ] && break; done
  hv="$("$b" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+' | head -1)"
  iv="$($ENGINE run --rm --entrypoint sh "$IMAGE" -c 'for b in /usr/libexec/mariadbd /usr/libexec/mysqld /usr/sbin/mariadbd /usr/sbin/mysqld; do [ -x $b ] && exec $b --version; done' 2>/dev/null | grep -oE '[0-9]+\.[0-9]+' | head -1)"
  echo "database version: host $hv, image $iv"
  [ -n "$hv" ] && [ "$hv" = "$iv" ] || { fail "different versions - the image would upgrade (or fail to read) the data files"; return 1; }
}
