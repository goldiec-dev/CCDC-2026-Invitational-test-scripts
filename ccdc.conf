# One config for deploy.sh, deploy.ps1, linux/fw.sh and linux/audit.sh.
# Fill it in during the first minutes of the competition, then copy the whole
# scripts folder to each box (Linux and Windows).

# deploy.sh refuses to run until someone has checked every value below.
CONFIG_REVIEWED=no

# ---------------------------------------------------------------- network
# Values from the 2026 MWCCDC Invitational team pack (10 VMs) - check this year's packet.
#   One LAN 172.20.240.0/24 behind the Palo Alto (inside .254, management .200):
#     Rocky 9 E-com .10, Ubuntu 22.04 Email .15, Debian 12 Splunk 10.0.2 .20,
#     Server 2022 AD .100, Server 2019 MSSQL .120, Ubuntu + Windows 11 workstations (DHCP)
#   Palo Alto outside 172.16.0.1/24 <-> VyOS internal 172.16.0.254/24
#   VyOS wkst 172.17.0.1/24 -> Kali 172.17.0.2; VyOS external 172.31.(20 + team).2/29
#   Public IPs: 172.25.(20 + team number).<same last octet> - e.g. team 5 E-com -> 172.25.25.10
INSIDE="172.20.240.0/24"      # internal team LAN
EXTERNAL="172.25.XX.0/24"     # team's public range: XX = 20 + team number

ECOM="172.20.240.10"          # Rocky Linux 9 E-com (+ its database)   public .10
WEBMAIL="172.20.240.15"       # Ubuntu 22.04 Email                     public .15
SPLUNK="172.20.240.20"        # Debian 12 Splunk 10.0.2                public .20
AD="172.20.240.100"           # Server 2022 AD / DNS                   public .100
MSSQL="172.20.240.120"        # Server 2019 MSSQL                      public .120
PA_MGMT="172.20.240.200"      # Palo Alto management (inside 172.20.240.254)
# Not in the 2026 invitational topology - leave empty unless this year's packet has them
WEB=""                        # separate IIS web server
FTP=""                        # separate FTP server
WIN11=""                      # Windows 11 workstation (2026: DHCP)
FTD_MGMT=""                   # Cisco FTD management
MYSQL=""                      # separate database server (2026: the DB is on the E-com box)

# Outside the Palo Alto (palo-alto/pa_policy.py, vyos/vyos_fw.sh)
PA_OUTSIDE="172.16.0.1"       # Palo Alto outside interface
VYOS_INSIDE="172.16.0.254"    # VyOS internal interface (toward the Palo Alto)
KALI="172.17.0.2"             # Kali workstation, behind the VyOS router only
KALI_NET="172.17.0.0/24"      # VyOS wkst segment (router 172.17.0.1)

# Rule: ICMP must stay up on every device, router and firewall included, so every
# firewall level allows inbound ping from anywhere.

# ---------------------------------------------------------------- palo alto policy
# palo-alto/pa_policy.py turns these into the Palo Alto allow-list. Everything else between
# outside and inside is dropped and logged. "HOSTVAR:proto/ports ..." - HOSTVAR is a host IP
# variable above; each rule matches the host's private AND public (172.25.(20+N).<last octet>)
# address, because PAN-OS matches the pre-NAT address. Source is always "any" (rule: public
# services stay open to every source IP). Ping to every listed host is always allowed.
# Inbound = scored services only (2026 pack). If Quotient shows a check on another port, or
# "pa_policy.py verify" shows the scorer being dropped, add the port here and re-run apply.
PA_INBOUND=(
  "ECOM:tcp/22,80,443"                 # SSH (dropped when SSH_SCORED=no), HTTP, HTTPS
  "WEBMAIL:tcp/22,25,80,110,143,443,465,587,993,995"   # SSH, SMTP, webmail, POP3, IMAP + their TLS
                                       # versions (secure.sh mail: SMTPS/submission, IMAPS, POP3S)
  "SPLUNK:tcp/22,8000,8089"            # SSH, Splunk query (web/REST), Splunk management
  "AD:tcp/53,5985,5986 udp/53"         # DNS, AD-WinRM
  "MSSQL:tcp/445,1433,3389"            # MSSQL SMB, MSSQL, RDP
  # FTP is in the pack's list but on no 2026 VM. If Quotient shows it on a box, e.g. E-com:
  # "ECOM:tcp/21,40000-40100"          # control + FTP_PASV passive ports (and FTP_SCORED=yes)
)
# Outbound from the LAN. INSIDE = every LAN host. Ping out is always allowed.
PA_OUTBOUND=(
  "INSIDE:udp/53,123 tcp/53,80,443"    # DNS, NTP, updates / downloads / Nextcloud
  "WEBMAIL:tcp/25"                     # mail delivery to other servers
)

# We manage every box from its VM console - no SSH between our machines. SSH_SCORED is only
# about the scoring engine ("a connection with authentication will be made to the respective
# platform"). It is the one switch for scored SSH:
#   yes: fw.sh opens 22 to everyone on the Linux servers (never the workstations), the Palo
#        Alto lets 22 in to the hosts that list it in PA_INBOUND, secure.sh hardens sshd
#   no:  22 closed everywhere (fw.sh and Palo Alto), secure.sh offers to stop sshd
# Keep yes until Quotient shows no SSH check.
SSH_SCORED=yes

# FTP (in the pack's scored list, no 2026 VM has it): yes = fw.sh opens 21 and the passive
# ports on this box; secure.sh ftp pins vsftpd's passive ports to FTP_PASV (min:max)
FTP_SCORED=no
FTP_PASV="40000:40100"

# Log packets the firewall drops (rate-limited, prefix CCDC-DROP-IN/OUT) for threat hunting
FW_LOG_DROPS=yes

# Firewall level deploy.sh starts with (light | medium | hard | extreme)
FIREWALL_LEVEL=medium

# ---------------------------------------------------------------- accounts
# Accounts the scoring engine logs in as. They still get new passwords - they
# are listed separately so you can submit the change right away: Quotient
# (quotient.ccdc.events) > PCR tab, CSV lines "username,password", applied immediately.
SCORED_USERS=()

# ---------------------------------------------------------------- web
# Web root to baseline for defacement (skipped if it doesn't exist on a box)
WEBROOT=/var/www/html
# yes = webguard puts changed files back automatically; no = alert only
WEBGUARD_AUTO_RESTORE=no
# Pages the HTTP/HTTPS checks load (from Quotient). secure.sh web checks that each one, after
# the HTTP -> HTTPS redirect, still ends on the same page HTTPS served before.
WEB_CHECK_PATHS=(/)
# Where audit.sh looks for webshells and DB credentials
WEB_ROOTS=(/var/www /srv/www /usr/share/nginx/html /usr/share/roundcube /var/lib/roundcube /etc/roundcube)

# ---------------------------------------------------------------- off-box backups
# linux/backup.sh writes /root/ccdc/full-backup-<time>/ on each box; linux/offbox.sh encrypts it
# with the team backup passphrase and uploads it to the vault during a short window that
# linux/vault.sh opens on the vault box (its own SFTP-only SSH server on BACKUP_VAULT_PORT,
# LAN-only, one-time password) and closes again. Servers may be re-tasked, workstations may not,
# so the vault is a server. The vault's own backup goes to BACKUP_VAULT_ALT.
BACKUP_VAULT="172.20.240.20"        # Splunk box
BACKUP_VAULT_ALT="172.20.240.10"    # E-com box (receives the Splunk box's backup)
BACKUP_VAULT_PORT=2222              # not 22: the scored sshd keeps 22 to itself

# ---------------------------------------------------------------- file integrity
# linux/fim.sh always watches /etc, system binaries, PAM modules, systemd units,
# cron, and SSH keys / shell startup files in /root and /home, plus per-role folders
# (DNS zones, MySQL plugins, Splunk apps). Add more here (read at "fim.sh init").
FIM_EXTRA_PATHS=()             # e.g. (/opt/myapp/config)
FIM_EXCLUDE=()                 # find -path patterns for files that change on their own
FIM_INTERVAL=60                # seconds between checks
# windows/fim.ps1 equivalents
WIN_FIM_EXTRA_PATHS=()         # e.g. ('C:\inetpub\custom')

# ---------------------------------------------------------------- wazuh (optional)
# IP of the Wazuh manager, if the team runs one (checklists/wazuh_instructions.md).
# fw.sh then lets agents reach it on TCP 1514/1515, and on the manager's own box opens
# 1514/1515 and the dashboard port to INSIDE. Empty = no Wazuh rules.
WAZUH=""
WAZUH_DASHBOARD_PORT=443       # change if 443 is already used on the manager's box

# ---------------------------------------------------------------- beacon detection
# linux/beacon.sh and windows/beacon.ps1 ignore NTP, DNS to this box's resolvers and
# SPLUNK:9997/8089. Add other EXPECTED regular traffic: IP, IP:PORT or :PORT
BEACON_ALLOW=()                # e.g. ("172.20.240.100:389" ":514")

# ---------------------------------------------------------------- outbound SSH
# linux/outbound_ssh.sh flags SSH connections FROM a box (pivoting / tunnels).
# Expected ones: IP, CIDR, IP:PORT or CIDR:PORT, e.g. ("172.20.240.0/24:22")
SSH_ALLOW=()                   # we don't SSH between our boxes, so every outbound SSH is suspicious
SSH_DEFAULT_PORTS=22           # comma-separated, e.g. 22,2222

# ---------------------------------------------------------------- port scanning
# linux/portscan.sh and windows/portscan.ps1 scan the team's own hosts (never other teams:
# targets outside INSIDE / EXTERNAL / SCAN_SCOPE and the host IPs above are refused).
# Expected open ports per host - anything else is flagged, missing ones are reported.
# 2026 scored services: HTTP, HTTPS, SMTP, POP3/IMAP/webmail, DNS, SSH, ping, Splunk query and
# management (8089), MSSQL SMB/RDP/1433, AD WinRM - adjust to what Quotient shows.
SCAN_EXPECT=(
  "172.20.240.10:22,80,443"                                     # E-com
  "172.20.240.15:22,25,80,110,143,443"                          # Email
  "172.20.240.20:22,8000,8089,9997"                             # Splunk
  "172.20.240.100:53,88,135,389,445,464,636,3268,3269,5985"     # AD / DNS (+ WinRM)
  "172.20.240.120:135,445,1433,3389"                            # MSSQL (SMB, SQL, RDP)
)
SCAN_TARGETS=()    # extra hosts / CIDRs to scan by default
SCAN_SCOPE=()      # extra CIDRs that count as ours, e.g. (172.16.0.0/24 172.17.0.0/24) for the
                   # PA-VyOS transit and the Kali segment, if they are reachable from inside

# ---------------------------------------------------------------- windows
# Read by deploy.ps1 (SCORED_USERS above may list Windows users too; each machine
# only uses the ones that exist on it).
WIN_WEBROOT='C:\inetpub\wwwroot'   # IIS site to baseline for defacement
WIN_EXPECTED_ADMINS=()               # legit extra local Administrators members, e.g. (webadmin)

# ---------------------------------------------------------------- per role
# deploy.sh sets CCDC_ROLE; anything listening outside these ports is flagged.
# Run audit.sh by hand with CCDC_ROLE=ecom to get the same check.
# Roles in the 2026 topology: ecom, mail, splunk, workstation (dns / mysql: older topologies)
case "${CCDC_ROLE:-}" in
  ecom)        EXPECTED_PORTS=(22 80 443) ;;        # the shop DB on this box should listen on 127.0.0.1 only
  mail)        EXPECTED_PORTS=(22 25 80 110 143 443 465 587 993 995) ;;
  splunk)      EXPECTED_PORTS=(22 514 8000 8089 8191 9997) ;;
  workstation) EXPECTED_PORTS=(22) ;;
  dns)         EXPECTED_PORTS=(22 53) ;;
  mysql)       EXPECTED_PORTS=(22 3306) ;;
  *)           EXPECTED_PORTS=() ;;
esac
